<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face ID Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #lottie-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #lottie-container.shake {
            animation: appleShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }
        @keyframes appleShake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
        svg {
            width: 100% !important;
            height: 100% !important;
            filter: drop-shadow(0 4px 16px rgba(0, 122, 255, 0.15));
        }
    </style>
    <script src="lottie.min.js"></script>
</head>
<body>
    <div id="lottie-container"></div>

    <script>
        let anim = null;
        let currentState = 'idle';
        const container = document.getElementById('lottie-container');

        function notifySwift(message) {
            try {
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.faceIDBridge) {
                    window.webkit.messageHandlers.faceIDBridge.postMessage(message);
                }
            } catch (e) {
                console.error("Swift bridge error:", e);
            }
        }

        fetch('AppleFaceID.json')
            .then(res => res.json())
            .then(animationData => {
                anim = lottie.loadAnimation({
                    container: container,
                    renderer: 'svg',
                    loop: false,
                    autoplay: false,
                    animationData: animationData
                });

                anim.addEventListener('DOMLoaded', () => {
                    notifySwift({ event: 'ready' });
                    setVisualState('idle');
                });

                anim.addEventListener('complete', () => {
                    notifySwift({ event: 'complete', state: currentState });
                });
            })
            .catch(err => {
                console.error("Failed to load animation:", err);
                notifySwift({ event: 'error', message: err.toString() });
            });

        function setVisualState(state) {
            if (!anim) return;
            currentState = state;
            container.classList.remove('shake');

            switch (state) {
                case 'idle':
                    // Static / subtle neutral face
                    anim.loop = false;
                    anim.setSpeed(1.0);
                    anim.goToAndStop(15, true);
                    break;

                case 'searching':
                    // Subtle search pulse
                    anim.loop = true;
                    anim.setSpeed(1.0);
                    anim.playSegments([15, 60], true);
                    break;

                case 'scanning':
                    // Active scanning with spinning circles
                    anim.loop = true;
                    anim.setSpeed(1.25);
                    anim.playSegments([25, 75], true);
                    break;

                case 'success':
                    // Morph to checkmark tick and stay
                    anim.loop = false;
                    anim.setSpeed(1.15);
                    anim.playSegments([75, 115], true);
                    break;

                case 'failure':
                    // Shake container and reset to idle
                    container.classList.add('shake');
                    anim.loop = false;
                    anim.goToAndStop(15, true);
                    setTimeout(() => {
                        container.classList.remove('shake');
                    }, 500);
                    break;

                case 'play_full':
                    // Play the entire sequence
                    anim.loop = false;
                    anim.setSpeed(1.0);
                    anim.playSegments([0, 115], true);
                    break;

                default:
                    anim.goToAndStop(15, true);
                    break;
            }
        }

        // Direct method calls
        function play() { if (anim) anim.play(); }
        function pause() { if (anim) anim.pause(); }
        function reset() { setVisualState('idle'); }
    </script>
</body>
</html>
